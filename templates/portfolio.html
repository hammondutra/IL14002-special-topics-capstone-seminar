<!doctype html>

<head>

  <title>Selected Writing — Hammon Dutra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#eeeae2;--ink:#1a1b1c;--muted:#79766f;--red:#b64032;--line:#c9c3b6;--display:'Instrument Serif',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'IBM Plex Mono',Consolas,monospace}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}a{color:inherit;text-decoration:none}a:focus-visible{outline:3px solid var(--red);outline-offset:4px}.topbar{height:83px;padding:0 max(22px,5vw);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:29px;font-weight:700;letter-spacing:-.13em}.brand span{color:var(--red)}.topbar .caption{font:10px var(--mono);letter-spacing:.1em;color:#79766f}.hero{max-width:1420px;margin:auto;padding:100px max(22px,5vw) 85px;border-bottom:1px solid var(--line)}.eyebrow{font:12px var(--mono);color:var(--red);letter-spacing:.13em}.hero h1{font:normal clamp(76px,10vw,160px)/.83 var(--display);letter-spacing:-.045em;margin:25px 0}.hero h1 em{font-weight:400;color:var(--red)}.hero p:last-child{max-width:590px;font:21px/1.35 var(--display);color:#67615c}.work-grid{max-width:1420px;margin:auto;padding:65px max(22px,5vw) 125px;display:grid;grid-template-columns:1fr 1fr;gap:28px}.section-bar{grid-column:1/-1;display:flex;justify-content:space-between;font:11px var(--mono);letter-spacing:.1em;margin-bottom:10px}.work-card{min-height:575px;display:flex;flex-direction:column;justify-content:space-between;padding:35px;background:#181a1c;color:#ede8dd;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}.work-card:hover{transform:translateY(-6px);box-shadow:0 18px 45px #0002}.card-two{background:#963d35}.card-label{font:11px var(--mono);letter-spacing:.1em;position:relative;z-index:2}.work-card h2{font:400 clamp(51px,5.5vw,80px)/.96 var(--display);letter-spacing:-.03em;position:relative;z-index:2;margin:32px 0}.work-card h2 em{color:#e7a399;font-weight:400}.card-one h2 em{color:#cfc7b8}.work-card p{max-width:390px;font:19px/1.35 var(--display);position:relative;z-index:2;color:#dbd3ca}.card-footer{position:relative;z-index:2;border-top:1px solid #ffffff63;padding-top:20px;display:flex;justify-content:space-between;font:11px var(--mono)}.circle-art{position:absolute;right:-95px;bottom:75px;width:380px;height:380px;border:2px solid #ede4d138;border-radius:50%;box-shadow:0 0 0 35px #ede4d110,0 0 0 70px #ede4d106}.card-two .circle-art{right:-60px;bottom:80px;width:280px;height:280px;border:16px solid #d28a7b35;box-shadow:0 0 0 39px #e0af9b11}.footer{background:var(--ink);color:#c3beb4;padding:35px max(22px,5vw);display:flex;justify-content:space-between;gap:15px;font:11px var(--mono)}@media(max-width:800px){.hero{padding-top:75px;padding-bottom:65px}.work-grid{grid-template-columns:1fr;padding-top:40px}.work-card{min-height:490px}.footer{flex-direction:column}.hero h1{font-size:clamp(78px,15vw,128px)}}
  .card-three{background:#284b42}.card-four{background:#69503a}.card-five{background:#41436b}.work-card{min-height:450px}.work-card h2{font-size:clamp(40px,5vw,68px);overflow-wrap:break-word}.card-three .circle-art,.card-four .circle-art,.card-five .circle-art{display:none}@media(max-width:480px){.work-card{min-height:360px;padding:25px}.hero h1{font-size:clamp(60px,15vw,100px)}}@media(prefers-reduced-motion:reduce){.work-card{transition:none}}</style>
</head>
<body>
  <header class="topbar"><a class="brand" href="./" aria-label="Hammon Dutra selected writing">HD<span>.</span></a><span class="caption">IL14002 / PUBLIC WRITING / 2026</span></header>
  <main>

    </section>
  </main>
  <footer class="footer"><span>HAMMON DUTRA / MINERVA UNIVERSITY</span><span>IL14002 • SELECTED PUBLIC WRITINGS</span></footer>
</body>
</html>
